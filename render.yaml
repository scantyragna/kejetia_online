# Render Blueprint — one-click deploy for Kejetia Online (full stack).
# Push this repo to GitHub and create a new Blueprint on Render, or use
# "Deploy from Blueprint" with this file.
#
#   • Frontend + backend  — one Next.js web service (the app is full-stack;
#     all "backend" APIs live in app/api/* and run in the same container).
#   • Database             — external Neon Postgres. No Render database is
#                            provisioned (Render's free Postgres expires after
#                            30 days; Neon's free tier does not).
#   • Migrations           — db/schema.sql is applied automatically on boot by
#                            scripts/migrate.mjs (idempotent).
#
# ── SETUP ─────────────────────────────────────────────────────────────────
# After creating this Blueprint, set DATABASE_URL by hand in the Render
# dashboard (Environment → add DATABASE_URL) with your Neon connection string.
# Use the POOLED connection string (see .env.example) — Render runs many
# short-lived requests and a pooled endpoint prevents exhausting connections.
# It is marked `sync: false` below so the Blueprint does not try to read it
# from a Render database that no longer exists.

services:
  - type: web
    name: kejetia-online-web
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon POOLED connection string in the dashboard
      - key: NEXT_PUBLIC_DB_MODE
        value: postgres
      - key: PORT
        value: 3000